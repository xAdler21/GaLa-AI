name: Images

# Baut die Server-Images, testet sie und legt sie in die GitHub-Registry (ghcr.io).
# Die VMs laden sie von dort (deploy/common/images.sh) und bauen nicht mehr selbst.
#
#   ghcr.io/<besitzer>/<repo>/coordinator:<commit-sha>
#   ghcr.io/<besitzer>/<repo>/worker-cpu:<commit-sha>
#   ghcr.io/<besitzer>/<repo>/worker-vision:<commit-sha>
#   ghcr.io/<besitzer>/<repo>/bench:<commit-sha>
# Zusätzlich jeweils die Tags "main" und die Versionsnummer <major>.<minor>.<lauf>
# (major.minor aus [workspace.package] in Cargo.toml, lauf = Nummer dieses Workflow-Laufs),
# z. B. 0.1.12. Nach erfolgreichem Hochladen aller Images bekommt der Commit das Git-Tag
# v0.1.12; im Admin-Panel lässt sich so per Versionsnummer aktualisieren.
#
# Bewusst schlichte docker-Befehle statt build-push-action: das Bench-Image setzt
# auf dem lokal gebauten Worker-Image auf (FROM), das geht nur im Docker-Daemon
# selbst. Dafür gibt es keinen Layer-Cache zwischen den Läufen (ein Lauf ca. 15 min).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: coordinator
            dockerfile: docker/coordinator.Dockerfile
            build_args: FEATURES=embed
          - name: worker-cpu
            dockerfile: docker/worker.Dockerfile
            build_args: ""
          - name: worker-vision
            dockerfile: docker/worker.Dockerfile
            build_args: >-
              FEATURES=vision
              BUILD_IMAGE=rust:1-trixie
              RUNTIME_IMAGE=debian:trixie-slim
    steps:
      - uses: actions/checkout@v4

      - name: Image-Namen
        run: |
          repo="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "REPO=$repo" >>"$GITHUB_ENV"
          echo "IMAGE=$repo/${{ matrix.name }}" >>"$GITHUB_ENV"
          # major.minor aus Cargo.toml, dazu die fortlaufende Nummer dieses Laufs
          mm=$(sed -n 's/^version = "\([0-9]*\.[0-9]*\)\..*"/\1/p' Cargo.toml | head -n1)
          [ -n "$mm" ] || { echo "::error::Keine Version in Cargo.toml"; exit 1; }
          echo "VERSION=$mm.${{ github.run_number }}" >>"$GITHUB_ENV"

      - name: Bauen
        run: |
          args=()
          for a in ${{ matrix.build_args }}; do
            args+=(--build-arg "$a")
          done
          docker build -f "${{ matrix.dockerfile }}" "${args[@]}" \
            --build-arg "GALA_VERSION=$VERSION" \
            --label "org.opencontainers.image.version=$VERSION" \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            -t "$IMAGE:$GITHUB_SHA" -t "$IMAGE:main" -t "$IMAGE:$VERSION" .

      - name: "Test: Binary startet"
        run: docker run --rm "$IMAGE:$GITHUB_SHA" --help

      # --- nur worker-vision: Bibliotheken, Bench-Image, echte OCR ---

      - name: "Test: keine fehlenden Bibliotheken"
        if: matrix.name == 'worker-vision'
        run: |
          docker run --rm --entrypoint sh "$IMAGE:$GITHUB_SHA" -c \
            'ls -la /usr/local/lib/gala && ldd /usr/local/lib/gala/worker /usr/local/lib/gala/libpdfium.so' | tee ldd.txt
          if grep 'not found' ldd.txt; then
            echo "Dem Worker fehlen Bibliotheken im Image." >&2
            exit 1
          fi

      - name: Bench-Image bauen
        if: matrix.name == 'worker-vision'
        run: |
          docker build -f docker/bench.Dockerfile \
            --build-arg "WORKER_IMAGE=$IMAGE:$GITHUB_SHA" \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            -t "$REPO/bench:$GITHUB_SHA" -t "$REPO/bench:main" -t "$REPO/bench:$VERSION" .

      - name: "Test: OCR (Modelle laden, Test-PDF erkennen)"
        if: matrix.name == 'worker-vision'
        run: |
          mkdir -p "$RUNNER_TEMP/in"
          python3 deploy/ocr/mk-test-pdf.py "$RUNNER_TEMP/in/test-lv.pdf"
          chmod -R a+rX "$RUNNER_TEMP/in"
          docker run --rm -v "$RUNNER_TEMP/in:/in:ro" "$REPO/bench:$GITHUB_SHA" \
            ocr /in --device cpu --max-pages 2 2>&1 | tee ocr.log
          grep -q '^Seiten: 2,' ocr.log
          # Erkannt werden muss wirklich Text: jede Seite hat rund 50 Zeilen.
          tokens=$(sed -n 's/.* \([0-9][0-9]*\) Tokens .*/\1/p' ocr.log | sort -n | head -n1)
          echo "wenigste Tokens je Seite: ${tokens:-keine}"
          [ "${tokens:-0}" -ge 100 ]

      # --- Veröffentlichen ---

      - name: Anmelden an ghcr.io
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Hochladen
        run: |
          # Bis zu drei Versuche. Scheitert es endgültig, steht die Meldung als
          # Anmerkung am Lauf (die Logs selbst sind nur angemeldet lesbar).
          push() {
            local out i
            for i in 1 2 3; do
              if out=$(docker push "$1" 2>&1); then
                printf '%s\n' "$out" | tail -n 2
                return 0
              fi
              printf '%s\n' "$out" | tail -n 20
              echo "Versuch $i für $1 fehlgeschlagen"
              sleep 20
            done
            echo "::error title=docker push ${1##*/}::$(printf '%s' "$out" | tail -n 8 | tr '\n' ' ' | cut -c1-1500)"
            return 1
          }
          docker version --format 'Docker {{.Server.Version}}, Treiber {{.Server.Driver}}' || true
          push "$IMAGE:$GITHUB_SHA"
          push "$IMAGE:main"
          push "$IMAGE:$VERSION"
          if [ "${{ matrix.name }}" = worker-vision ]; then
            push "$REPO/bench:$GITHUB_SHA"
            push "$REPO/bench:main"
            push "$REPO/bench:$VERSION"
          fi

  # Erst wenn alle Images oben sind: Commit mit der Versionsnummer markieren (v0.1.12).
  # Das Admin-Panel aktualisiert per Versionsnummer auf genau diesen Commit.
  tag:
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Git-Tag setzen
        run: |
          mm=$(sed -n 's/^version = "\([0-9]*\.[0-9]*\)\..*"/\1/p' Cargo.toml | head -n1)
          tag="v$mm.${{ github.run_number }}"
          git tag "$tag" "$GITHUB_SHA"
          git push origin "refs/tags/$tag"
          echo "Version $mm.${{ github.run_number }} = $tag" >>"$GITHUB_STEP_SUMMARY"
