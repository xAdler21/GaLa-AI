name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Systempakete
        run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config
      # Übernimmt Kanal, Komponenten und WASM-Target aus rust-toolchain.toml
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: true
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      # Rolle vision (so bauen die Images) und die im Betrieb ungenutzte GPU-Variante sind im
      # Standard-Build aus; ohne diese Schritte bliebe ihr Code ungeprüft.
      - name: Clippy (Rolle vision)
        run: cargo clippy -p worker --features worker/vision --all-targets -- -D warnings
      - name: Clippy (GPU-Features)
        # Scheitert der Schritt, steht das Ende der Ausgabe als Anmerkung am Lauf
        # (die Logs selbst sind nur angemeldet lesbar).
        run: |
          set -o pipefail
          if ! cargo clippy -p worker -p bench --features worker/cuda,bench/cuda --all-targets -- -D warnings 2>&1 | tee clippy-gpu.log; then
            tail_text=$(grep -v -E '^\s*(Compiling|Checking|Downloaded|Downloading|Finished) ' clippy-gpu.log | tail -n 15 | tr '\n' ' ' | cut -c1-1800)
            echo "::error title=Clippy GPU-Features::frei auf /: $(df -h --output=avail / | tail -n1 | tr -d ' ') | $tail_text"
            exit 1
          fi
      - name: Tests
        run: cargo test --workspace
      - name: Client-Crates für WASM
        run: cargo check -p lv-model -p api-types --target wasm32-unknown-unknown
