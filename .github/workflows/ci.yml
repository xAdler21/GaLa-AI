name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Systempakete
        run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config
      # Übernimmt Kanal, Komponenten und WASM-Target aus rust-toolchain.toml
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: true
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      # Rolle vision (so bauen die Images) ist im Standard-Build aus; ohne diesen Schritt bliebe
      # ihr Code ungeprüft.
      # shortcut: worker/cuda und bench/cuda werden nicht geprüft. Das Build-Skript von
      # ort-sys 2.0.0-rc.13 bricht mit CUDA unter Linux ab (copy-dylibs, dynamic_link.rs:45).
      # Wieder aufnehmen, wenn ort aktualisiert wird oder eine GPU-OCR gebraucht wird.
      - name: Clippy (Rolle vision)
        run: cargo clippy -p worker --features worker/vision --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace
      - name: Client-Crates für WASM
        run: cargo check -p lv-model -p api-types --target wasm32-unknown-unknown
