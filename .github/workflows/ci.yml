name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Systempakete
        run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config
      # Übernimmt Kanal, Komponenten und WASM-Target aus rust-toolchain.toml
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: true
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      # Die GPU-Features sind im Standard-Build aus; ohne diesen Schritt bliebe ihr Code ungeprüft.
      - name: Clippy (GPU-Features)
        run: cargo clippy -p worker -p bench --features worker/vision,bench/cuda --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace
      - name: Client-Crates für WASM
        run: cargo check -p lv-model -p api-types --target wasm32-unknown-unknown
