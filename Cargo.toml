[workspace]
resolver = "3"
members = [
    "crates/doc-ir",
    "crates/lv-model",
    "crates/api-types",
    "crates/pdf",
    "crates/ocr",
    "crates/gaeb",
    "crates/export",
    "crates/db",
    "crates/llm",
    "crates/retrieval",
    "crates/ingest",
    "crates/chat",
    "apps/bench",
    "apps/coordinator",
    "apps/worker",
]
# Die Desktop-App (Tauri + Leptos/WASM) ist ein eigener Workspace, weil sie
# webkit/WebView2 und trunk braucht. Sie bindet api-types per Pfad ein.
exclude = ["apps/desktop"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
# interne Crates
doc-ir = { path = "crates/doc-ir" }
lv-model = { path = "crates/lv-model" }
api-types = { path = "crates/api-types" }
pdf = { path = "crates/pdf" }
ocr = { path = "crates/ocr" }
gaeb = { path = "crates/gaeb" }
export = { path = "crates/export" }
db = { path = "crates/db" }
llm = { path = "crates/llm" }
retrieval = { path = "crates/retrieval" }
ingest = { path = "crates/ingest" }
chat = { path = "crates/chat" }

# Basis
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rust_decimal = { version = "1", features = ["serde"] }
rust_decimal_macros = "1"
uuid = { version = "1", features = ["serde"] }
chrono = { version = "0.4", default-features = false, features = ["serde", "std"] }
thiserror = "2"
anyhow = "1"

# CLI / Logging
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Dokumente / OCR
pdfium-render = "0.9"
image = "0.25"
oar-ocr = "0.10"
# Gleiche Version wie oar-ocr/fastembed (dort exakt gepinnt). Nur für die Prüfung, ob der
# CUDA-Provider lädt (crates/ocr); die Features kommen über oar-ocr.
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std"] }

# GAEB / Export
roxmltree = "0.21"
encoding_rs = "0.8"
quick-xml = "0.42"
rust_xlsxwriter = "0.101"
calamine = "0.37"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1

# Bildverarbeitung und Inferenz-Glue auch im Dev-Build optimieren, sonst sind Benchmarks wertlos.
[profile.dev.package."*"]
opt-level = 2
