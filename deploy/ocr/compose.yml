# gala-ocr: worker --role vision (OCR + Embeddings) auf der GTX 950.
#
#   /opt/gala/deploy/common/dc.sh ocr up -d --build
#
# Variablen aus /etc/gala/hosts.env und /etc/gala/ocr.env.
# Hinweis GTX 950 (Maxwell, sm_52): siehe docs/BETRIEB.md.

name: gala

services:
  worker-vision:
    build:
      context: ../..
      dockerfile: docker/worker.Dockerfile
      args:
        FEATURES: ${GALA_WORKER_FEATURES-vision}
        RUNTIME_IMAGE: ${GALA_CUDA_RUNTIME_IMAGE:-nvidia/cuda:12.8.1-cudnn-runtime-ubuntu24.04}
    image: gala/worker-vision:local
    container_name: gala-worker-vision
    restart: unless-stopped
    init: true
    command: ["--role", "vision"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-gala}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD in /etc/gala/ocr.env setzen}@gala-coordinator:5432/${POSTGRES_DB:-gala}
      GALA_DATA_DIR: /srv/gala/data
      GALA_ARCHIV_ROOT: /mnt/archiv
      GALA_LLM_URL: ${GALA_LLM_URL:-http://gala-llm:8080}
      RUST_LOG: ${RUST_LOG:-info}
      # Nur die GTX 950 (die VM hat genau eine GPU)
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    volumes:
      # NAS (CIFS, read-only) und Datei-Store (NFS von gala-coordinator);
      # beide werden vom Host (fstab) eingebunden, siehe install.sh.
      - /mnt/archiv:/mnt/archiv:ro
      - /srv/gala/data:/srv/gala/data
      # Heruntergeladene OCR-/Embedding-Modelle
      - oar-models:/var/cache/gala/oar
    extra_hosts:
      - "gala-coordinator:${GALA_COORDINATOR_IP:?GALA_COORDINATOR_IP fehlt in /etc/gala/hosts.env}"
      - "gala-llm:${GALA_LLM_IP:?GALA_LLM_IP fehlt in /etc/gala/hosts.env}"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  oar-models:
