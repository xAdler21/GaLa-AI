# gala-ocr: worker --role vision (OCR + Embeddings, beides auf der CPU).
#
#   /opt/gala/deploy/common/dc.sh ocr up -d
# Das Image stellt vorher deploy/common/images.sh bereit (Registry oder lokaler Build).
#
# Variablen aus /etc/gala/hosts.env und /etc/gala/ocr.env.

name: gala

services:
  worker-vision:
    build:
      context: ../..
      dockerfile: docker/worker.Dockerfile
      args:
        FEATURES: ${GALA_WORKER_FEATURES-vision}
        # trixie: die vorgebaute ONNX Runtime braucht glibc >= 2.38 (siehe worker.Dockerfile)
        BUILD_IMAGE: ${GALA_WORKER_BUILD_IMAGE:-rust:1-trixie}
        RUNTIME_IMAGE: ${GALA_WORKER_RUNTIME_IMAGE:-debian:trixie-slim}
        GALA_VERSION: ${GALA_VERSION:-}
    # Registry-Image eines Commits oder lokal gebaut: deploy/common/images.sh
    image: ${GALA_IMAGE_REPO:-gala}/worker-vision:${GALA_IMAGE_TAG:-local}
    container_name: gala-worker-vision
    restart: unless-stopped
    init: true
    command: ["--role", "vision"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-gala}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD in /etc/gala/ocr.env setzen}@gala-coordinator:5432/${POSTGRES_DB:-gala}
      GALA_DATA_DIR: /srv/gala/data
      GALA_ARCHIV_ROOT: /mnt/archiv
      GALA_LLM_URL: ${GALA_LLM_URL:-http://gala-llm:8080}
      RUST_LOG: ${RUST_LOG:-info}
      # Die VM hat keine Grafikkarte, das Image enthält kein CUDA.
      GALA_OCR_DEVICE: cpu
      # Fester Name für das Admin-Panel (sonst die wechselnde Container-ID)
      GALA_WORKER_NAME: gala-ocr-vision
    volumes:
      # NAS (CIFS, read-only) und Datei-Store (NFS von gala-coordinator);
      # beide werden vom Host (fstab) eingebunden, siehe install.sh.
      - /mnt/archiv:/mnt/archiv:ro
      - /srv/gala/data:/srv/gala/data
      # Heruntergeladene OCR-/Embedding-Modelle
      - oar-models:/var/cache/gala/oar
    extra_hosts:
      - "gala-coordinator:${GALA_COORDINATOR_IP:?GALA_COORDINATOR_IP fehlt in /etc/gala/hosts.env}"
      - "gala-llm:${GALA_LLM_IP:?GALA_LLM_IP fehlt in /etc/gala/hosts.env}"

volumes:
  oar-models:
