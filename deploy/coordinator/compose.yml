# gala-coordinator: Postgres, Coordinator, CPU-Worker, Caddy (TLS).
#
# Nicht direkt aufrufen, sondern über den Wrapper (setzt die env-Dateien):
#   /opt/gala/deploy/common/dc.sh coordinator up -d --build
#
# Variablen kommen aus /etc/gala/hosts.env und /etc/gala/coordinator.env.
# Veröffentlichte Ports werden zusätzlich von gala-docker-firewall.service
# (DOCKER-USER) auf die erlaubten Quellen beschränkt, weil Docker ufw umgeht.

name: gala

x-gala-env: &gala-env
  DATABASE_URL: postgres://${POSTGRES_USER:-gala}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD in /etc/gala/coordinator.env setzen}@postgres:5432/${POSTGRES_DB:-gala}
  GALA_DATA_DIR: /srv/gala/data
  GALA_LLM_URL: ${GALA_LLM_URL:-http://gala-llm:8080}
  RUST_LOG: ${RUST_LOG:-info}

services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: gala-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gala}
      POSTGRES_USER: ${POSTGRES_USER:-gala}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD in /etc/gala/coordinator.env setzen}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Auf allen Schnittstellen veröffentlicht; erreichbar ist der Port nur
      # für gala-ocr (DOCKER-USER-Regel aus deploy/common/docker-firewall.sh).
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 10

  coordinator:
    build:
      context: ../..
      dockerfile: docker/coordinator.Dockerfile
      args:
        # "embed" = Dokumenten-Chatbot an (lädt beim ersten Start BGE-M3, ca. 2 GB,
        # nach /srv/gala/data/models/fastembed). Leer = Chat antwortet mit 501.
        FEATURES: ${GALA_COORDINATOR_FEATURES-embed}
    image: gala/coordinator:local
    container_name: gala-coordinator
    restart: unless-stopped
    init: true
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *gala-env
      # Im Container an allen Adressen lauschen; nach außen wird 8080 nur an
      # 127.0.0.1 veröffentlicht (Zugriff von außen nur über Caddy).
      GALA_BIND: 0.0.0.0:8080
      GALA_INTERNAL_BIND: 0.0.0.0:8081
      GALA_PUBLIC_URL: ${GALA_PUBLIC_URL:-https://gala-coordinator}
      GALA_STATE_DIR: /var/lib/gala/state
      GALA_INTERNAL_TOKEN: ${GALA_INTERNAL_TOKEN:?GALA_INTERNAL_TOKEN in /etc/gala/coordinator.env setzen}
    volumes:
      - /srv/gala/data:/srv/gala/data
      - /var/lib/gala/state:/var/lib/gala/state
    ports:
      - "127.0.0.1:8080:8080"
      # /internal/*: nur die drei VMs (DOCKER-USER-Regel)
      - "8081:8081"
    extra_hosts:
      - "gala-llm:${GALA_LLM_IP:?GALA_LLM_IP fehlt in /etc/gala/hosts.env}"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  worker-cpu:
    build:
      context: ../..
      dockerfile: docker/worker.Dockerfile
      args:
        FEATURES: ""
    image: gala/worker-cpu:local
    container_name: gala-worker-cpu
    restart: unless-stopped
    init: true
    command: ["--role", "cpu"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *gala-env
      GALA_ARCHIV_ROOT: /mnt/archiv
    volumes:
      - /srv/gala/data:/srv/gala/data
      - /mnt/archiv:/mnt/archiv:ro
    extra_hosts:
      - "gala-llm:${GALA_LLM_IP:?GALA_LLM_IP fehlt in /etc/gala/hosts.env}"

  caddy:
    image: caddy:2
    container_name: gala-caddy
    restart: unless-stopped
    depends_on:
      - coordinator
    environment:
      GALA_HOSTNAME: ${GALA_HOSTNAME:-gala-coordinator}
      GALA_HOST_IP: ${GALA_COORDINATOR_IP:?GALA_COORDINATOR_IP fehlt in /etc/gala/hosts.env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Caddy-Daten auf dem Host, damit die interne Root-CA kopierbar ist
      # (deploy/coordinator/copy-ca.sh -> /srv/gala/data/ca.crt).
      - /var/lib/gala/caddy:/data
    ports:
      - "443:443"

volumes:
  pgdata:
