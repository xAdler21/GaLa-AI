# GaLa-AI: Zugang des Nutzers "claude" nur bei eingeschaltetem Admin-Schalter.
# Betrifft ausschliesslich den Nutzer claude, alle anderen Nutzer bleiben unveraendert.
# Installiert nach /etc/ssh/sshd_config.d/50-gala-claude.conf
Match User claude
    AuthorizedKeysFile none
    AuthorizedKeysCommand /usr/local/lib/gala/claude-keys %u
    AuthorizedKeysCommandUser nobody
    PasswordAuthentication no
    KbdInteractiveAuthentication no
