[package]
name = "retrieval"
description = "Embeddings und Vektorsuche (pgvector)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# =7.1.1: neuere fastembed-Versionen pinnen ort rc.15, oar-ocr (Crate ocr) braucht rc.13.
fastembed = { version = "=7.1.1", optional = true }
pgvector = { version = "0.4.2", features = ["sqlx"] }
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono"] }
thiserror.workspace = true
tracing.workspace = true
uuid.workspace = true

[features]
default = []
# BGE-M3 lokal über fastembed (ONNX Runtime). Standardmäßig aus, damit Builds leicht bleiben.
fastembed = ["dep:fastembed"]

[lints]
workspace = true
