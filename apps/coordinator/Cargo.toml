[package]
name = "coordinator"
description = "Coordinator: REST-API für die Desktop-App, Admin-Panel, Updates"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
api-types.workspace = true
chat.workspace = true
chrono.workspace = true
clap.workspace = true
db.workspace = true
llm.workspace = true
retrieval.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
argon2 = "0.6.0"
askama = "0.16.1"
axum = { version = "0.8.9", features = ["multipart"] }
hex = "0.4.3"
rand = "0.10.3"
rpassword = "7.5.4"
semver = "1.0.28"
sha2 = "0.11.1"
subtle = "2.6.1"
tokio = { version = "1.54.1", features = ["full"] }
tokio-util = { version = "0.7.20", features = ["io"] }
tower-http = { version = "0.7.1", features = ["trace"] }

[features]
default = []
# Dokumenten-Chatbot: BGE-M3 lokal auf dem Coordinator einbetten (ONNX Runtime). Ohne dieses
# Feature antwortet POST /api/v1/chat mit 501.
embed = ["retrieval/fastembed"]

[lints]
workspace = true

[dev-dependencies]
tower = { version = "0.5.3", features = ["util"] }
