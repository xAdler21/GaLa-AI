[package]
name = "ui"
description = "GaLa-AI Desktop-Oberflaeche (Leptos CSR, WASM)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
api-types = { path = "../../../crates/api-types" }
console_error_panic_hook = "0.1.7"
gloo-timers = { version = "0.4.0", features = ["futures"] }
js-sys = "0.3.107"
leptos = { version = "0.8.23", features = ["csr"] }
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
serde-wasm-bindgen = "0.6.5"
wasm-bindgen = "0.2.130"
wasm-bindgen-futures = "0.4.80"
web-sys = { version = "0.3.107", features = ["Window", "Document", "HtmlElement", "Element"] }

[lints.rust]
unsafe_code = "forbid"
