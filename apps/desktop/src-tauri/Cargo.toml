[package]
name = "gala-ai-desktop"
description = "GaLa-AI Desktop-App (Tauri 2)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
api-types = { path = "../../../crates/api-types" }
gethostname = "1.1.0"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "native-tls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2.12.5", features = [] }
tauri-plugin-process = "2.4.0"
tauri-plugin-store = "2.5.0"
tauri-plugin-updater = { version = "2.14.1", default-features = false, features = ["native-tls", "zip"] }

[lints.rust]
unsafe_code = "forbid"


